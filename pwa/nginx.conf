server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Not all file names contain a content hash (e.g. web.js), so always revalidate.
    # Offline support and fast startup are handled by the service worker.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    # Runtime configuration from environment variables. This file is a template,
    # the nginx image replaces ${...} with the values of the environment variables on startup.
    location = /pwa-config.js {
        default_type application/javascript;
        return 200 'window.ftPwaConfig = { defaultInvidiousInstance: "${FREETUBE_DEFAULT_INVIDIOUS_INSTANCE}" }\n';
    }

    # The app uses hash based routing, so there is no need for a fallback to index.html
    location / {
        try_files $uri $uri/ =404;
    }
}

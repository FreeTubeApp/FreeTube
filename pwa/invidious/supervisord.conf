[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D %(ENV_PGDATA)s -c listen_addresses=127.0.0.1
user=postgres
priority=10
autorestart=true
; SIGINT = fast shutdown
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:companion]
command=/app/invidious_companion
directory=/app
environment=HOST="127.0.0.1",PORT="8282",SERVER_BASE_PATH="/companion"
user=invidious
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:invidious]
command=/usr/local/bin/run-invidious.sh
directory=/invidious
user=invidious
priority=30
; also restarts Invidious after the regular stop in run-invidious.sh (exit code 124 from timeout)
autorestart=true
exitcodes=0,124
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

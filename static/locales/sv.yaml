Tooltips:
  Subscription Settings:
    Fetch Feeds from RSS: När alternativet är aktiverat använder FreeTube RSS i stället för den vanliga metoden för att hämta prenumerationsflödet. RSS är snabbare och minskar risken för IP-blockering, men saknar information som videolängd, direktsändningsstatus och inlägg
    Fetch Automatically: När det är aktiverat hämtar FreeTube automatiskt ditt prenumerationsflöde vid start och när ett nytt fönster öppnas.
  Player Settings:
    Default Video Format: Välj vilka format som ska användas vid videouppspelning. Med DASH-format kan videor spelas upp i högre kvalitet. Äldre format är begränsade till högst 360p men använder mindre bandbredd. Ljudformat innehåller endast ljudströmmar.
    Proxy Videos Through Invidious: Ansluter till Invidious för att visa videor i stället för att skapa en direktanslutning till YouTube.
    Skip by Scrolling Over Video Player: Använd mushjulet över videospelaren för att spola i videon, på samma sätt som i MPV.
    Scroll Playback Rate Over Video Player: När markören är över videon håller du ned Ctrl-tangenten (kommandotangenten på Mac) och rullar mushjulet framåt eller bakåt för att ändra uppspelningshastigheten. Håll ned Ctrl-tangenten (kommandotangenten på Mac) och vänsterklicka för att snabbt återgå till standardhastigheten (1× om den inte har ändrats i inställningarna).
  General Settings:
    Region for Trending: Välj vilket lands trendande videor som ska visas.
    Invidious Instance: Invidious-instansen som FreeTube använder för API-anrop.
    Thumbnail Preference: Ersätt videornas vanliga miniatyrbilder med en bildruta från videon, en suddig bild eller en dold miniatyrbild.
    Fallback to Non-Preferred Backend on Failure: När den föredragna API-källan inte fungerar försöker FreeTube automatiskt använda den alternativa API-källan.
    Preferred API Backend: Välj vilken datakälla FreeTube ska använda. Det lokala API:et använder FreeTubes inbyggda extraktor. Invidious-API:t kräver anslutning till en Invidious-instans.
    External Link Handling: "Välj vad som ska hända när du klickar på en länk som inte kan öppnas i FreeTube.\nSom standard öppnas länken i den förvalda webbläsaren.\n"
    Open Deep Links In New Window: URL:er som skickas till FreeTube, till exempel via omdirigering av webbläsartillägg eller kommandoradsargument, öppnas i ett nytt fönster.
  External Player Settings:
    Custom External Player Arguments: Alla anpassade kommandoradsargument ska skickas till den externa spelaren.
    Ignore Warnings: Dölj varningar när den valda externa spelaren inte stöder en åtgärd, exempelvis att vända en spellistas ordning.
    Custom External Player Executable: Som standard antar FreeTube att den valda externa spelaren kan hittas via PATH-miljövariabeln. Om det behövs kan en anpassad sökväg ställas in här.
    External Player: När en extern spelare har valts visas en ikon på miniatyrbilden för att öppna videon, eller spellistan om det stöds, i den externa spelaren. Invidious-inställningarna påverkar inte externa videospelare.
    DefaultCustomArgumentsTemplate: "(Förvalt: ”{defaultCustomArguments}”)"
    Ignore Default Arguments: Skicka inga förvalda argument till den externa spelaren utöver videons URL, exempelvis uppspelningshastighet eller spelliste-URL. Anpassade argument skickas fortfarande vidare.
  Distraction Free Settings:
    Hide Channels: Ange ett kanal-ID för att dölja kanalens videor, spellistor och kanalsida från sökresultat, trendande innehåll, populärt innehåll och rekommendationer. Kanal-ID:t måste matcha exakt och är skiftlägeskänsligt.
    Hide Subscriptions Live: Den här inställningen åsidosätts av inställningen ”{appWideSetting}” för hela programmet under ”{subsection}” i ”{settingsSection}”
    Hide Videos, Playlists and Channels Containing Text: Ange ett ord, ordfragment eller en fras för att dölja videor, spellistor och kanaler vars ursprungliga titlar innehåller texten. Matchningen är inte skiftlägeskänslig och gäller i hela FreeTube, förutom historiken, dina spellistor och videor i spellistor.
    Hide Videos on Watch: Dölj sedda videor på flikarna Videor, Shorts och Live på prenumerations- och kanalsidor. Kanalernas Hem-flik påverkas inte
  Experimental Settings:
    Replace HTTP Cache: Inaktivera Electrons diskbaserade HTTP-cacheminne och använd ett anpassat bildcacheminne i arbetsminnet. Detta ökar RAM-användningen.
  SponsorBlock Settings:
    UseDeArrowTitles: Ersätt videotitlar med titlar som användare har skickat in från DeArrow.
    UseDeArrowThumbnails: Ersätt videominiatyrer med miniatyrer från DeArrow.

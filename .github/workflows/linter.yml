name: Linter

on:
  pull_request:
    branches: [ master, development, '**-RC' ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm and Node.js 24
      uses: pnpm/setup@4f13ee5aab1d5632c834b3d81877f68f8b80f337
      with:
        runtime: node@24.x
        version: 11
        cache: true

    - run: pnpm run ci
      shell: bash
    - run: pnpm run lint
      shell: bash
    # let's verify that webpack is able to package the project
    - run: pnpm run pack
      shell: bash
    # verify that webpack is able to package the project using the web config
    - run: pnpm run pack:web
      shell: bash

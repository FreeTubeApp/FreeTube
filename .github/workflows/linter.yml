name: Linter

on:
  pull_request:
    branches: [ master, development, '**-RC' ]

cache-mode: none
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    cache-mode: read
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js 24.x
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 24.x
        package-manager-cache: false

    - name: Install pnpm
      uses: pnpm/action-setup@v6.1.1
      with:
        version: 11
        cache: false

    - name: Get pnpm cache directory
      id: cache_dir
      shell: bash
      run: |
        {
          echo 'cache_dir<<EOF'
          pnpm store path
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Restore pnpm cache
      id: restore_cache
      uses: actions/cache/restore@v6.1.0
      with:
        key: ${{ format('node-cache-{0}-{1}-pnpm-{2}', runner.os, runner.arch, hashFiles('pnpm-lock.yaml')) }}
        path: ${{ steps.cache_dir.outputs.cache_dir }}

    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm run lint
      shell: bash
    # let's verify that webpack is able to package the project
    - run: pnpm run pack
      shell: bash
    # verify that webpack is able to package the project using the web config
    - run: pnpm run pack:web
      shell: bash

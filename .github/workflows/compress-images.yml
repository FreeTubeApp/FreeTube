name: Compress Images
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - '_icons/**'
      - 'src/renderer/assets/img/**'

cache-mode: none
permissions: {}

concurrency:
  group: compress-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compress:
    name: Compress
    runs-on: ubuntu-slim

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1

      - name: Install Oxipng
        run: cargo install oxipng
        shell: bash

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 11
          cache: false

      - name: Compress SVG Images
        run: |
          pnpm dlx svgo -r -f ./_icons -o ./_icons
          pnpm dlx svgo -r -f ./src/renderer/assets/img -o ./src/renderer/assets/img
        shell: bash
      - name: Compress PNG Images
        run: oxipng -o max --strip safe --recursive ./_icons  ./src/renderer/assets/img
        shell: bash

      - name: Generate File Diff Content
        id: file_diff
        uses: PikachuEXE/file-size-diff@master
        with:
          target_branch: ${{ github.event.repository.default_branch }}
          dir_glob: "**/*.png,**/*.svg"

      - name: Create New Pull Request If Needed
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          title: Compressed Images
          branch-suffix: timestamp
          commit-message: Compress Images
          body: |
            Images automagically compressed by tools in `.github/workflows/compress-images.yml`

            ${{ steps.file_diff.outputs.file_size_diff_content_markdown }}

name: Compress Images
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - '_icons/**'
      - 'src/renderer/assets/img/**'

cache-mode: none
permissions: {}

concurrency:
  group: compress-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compress:
    name: Compress
    runs-on: ubuntu-slim

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install Oxipng
        run: cargo install oxipng
        shell: bash

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
          cache: false

      - name: Compress SVG Images
        run: |
          pnpm dlx svgo -r -f ./_icons -o ./_icons
          pnpm dlx svgo -r -f ./src/renderer/assets/img -o ./src/renderer/assets/img
        shell: bash
      - name: Compress PNG Images
        run: oxipng -o max --strip safe --recursive ./_icons  ./src/renderer/assets/img
        shell: bash

      - name: Generate File Diff Content
        id: file_diff
        uses: PikachuEXE/file-size-diff@c623d1e49f0b19ecb006caf05522f9756561052b
        with:
          target_branch: ${{ github.event.repository.default_branch }}
          dir_glob: "**/*.png,**/*.svg"

      - name: Create New Pull Request If Needed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: Compressed Images
          branch-suffix: timestamp
          commit-message: Compress Images
          body: |
            Images automagically compressed by tools in `.github/workflows/compress-images.yml`

            ${{ steps.file_diff.outputs.file_size_diff_content_markdown }}

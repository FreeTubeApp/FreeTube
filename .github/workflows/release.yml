# This is a basic workflow that is manually triggered

name: Upload Release

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Tag

permissions: {}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:

    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [24.x]
        runtime:
          - linux-x64
          - linux-armv7l
          - linux-arm64
          - win-x64
          - win-arm64
          - osx-x64
          - osx-arm64
        include:
        - runtime: linux-x64
          os: ubuntu-latest
          appimage-arch: amd64

        - runtime: linux-armv7l
          os: ubuntu-latest
          appimage-arch: armv7l

        - runtime: linux-arm64
          os: ubuntu-latest
          appimage-arch: arm64

        - runtime: osx-x64
          os: macOS-latest

        - runtime: osx-arm64
          os: macOS-latest

        - runtime: win-x64
          os: windows-latest

        - runtime: win-arm64
          os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      with:
        persist-credentials: false

    # Do not restore the pnpm cache, to avoid cache poisoning affecting releases
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false

    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 #v6.0.9
      with:
        version: 10
        cache: false

    - run: pnpm run ci
      shell: bash
    - run: pnpm run lint
      shell: bash

    - name: Get Version Number
      id: getPackageInfo
      shell: bash
      run: |
        jq --raw-output '"version=" + .version' package.json >> "$GITHUB_OUTPUT"

    - name: Install libarchive-tools
      if: startsWith(matrix.os, 'ubuntu')
      shell: bash
      run: |
        sudo apt update
        sudo apt -y install libarchive-tools

    - name: Build x64 with Node.js ${{ matrix.node-version}}
      if: contains(matrix.runtime, 'x64')
      shell: bash
      run: pnpm run build

    - name: Build ARMv7l with Node.js ${{ matrix.node-version}}
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      shell: bash
      run: pnpm run build:arm32

    - name: Build ARM64 with Node.js ${{ matrix.node-version}}
      if: contains(matrix.runtime, 'arm64')
      shell: bash
      run: pnpm run build:arm64

    - name: Add update information to AppImage
      if: startsWith(matrix.os, 'ubuntu')
      shell: bash
      env:
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
        APPIMAGE_ARCH: ${{ matrix.appimage-arch }}
      run: |
        update_info="gh-releases-zsync|FreeTubeApp|FreeTube|latest-all|freetube-*-${APPIMAGE_ARCH}.AppImage.zsync"

        cd build

        section_offset_hex="$(objdump --section-headers ./FreeTube-${VERSION}*.AppImage | awk '$2 == ".upd_info" { printf $6 }')"

        script='const fd = fs.openSync(process.argv[3], "r+"); fs.writeSync(fd, process.argv[2], parseInt(process.argv[1], 16)); fs.closeSync(fd)'

        node -e "$script" $section_offset_hex "$update_info" ./FreeTube-${VERSION}*.AppImage

        zsyncmake -u "freetube-${VERSION}-beta-${APPIMAGE_ARCH}.AppImage" ./FreeTube-${VERSION}*.AppImage

    - name: Upload Linux .zip x64 Release
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: pwsh
      run: Move-Item -Path "build/freetube-${{ steps.getPackageInfo.outputs.version }}.zip" -Destination "freetube-${{ steps.getPackageInfo.outputs.version }}-beta-linux-x64-portable.zip" && gh release upload "${{ inputs.tag }}" "freetube-${{ steps.getPackageInfo.outputs.version }}-beta-linux-x64-portable.zip"

    - name: Upload Linux .7z x64 Release
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: pwsh
      run: Move-Item -Path "build/freetube-${{ steps.getPackageInfo.outputs.version }}.7z" -Destination "freetube-${{ steps.getPackageInfo.outputs.version }}-beta-linux-x64-portable.7z" && gh release upload "${{ inputs.tag }}" "freetube-${{ steps.getPackageInfo.outputs.version }}-beta-linux-x64-portable.7z"

    - name: Upload Linux .zip ARMv7l Release
